<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="48" font-size="28" fill="#334155">数据发展方向：沿模型预测，再由测量修正</text><text x="48" y="82" font-size="17" fill="#64748b">假设一秒内匀速；同一时刻的预测、测量与后验估计是三个不同的量。</text><line x1="105" y1="160" x2="105" y2="525" stroke="#e2e8f0" stroke-width="1.5" /><text x="93" y="553" font-size="15" fill="#334155">0.0</text><line x1="105" y1="525" x2="1115" y2="525" stroke="#e2e8f0" stroke-width="1.5" /><text x="50" y="530" font-size="15" fill="#334155">9.0</text><line x1="307" y1="160" x2="307" y2="525" stroke="#e2e8f0" stroke-width="1.5" /><text x="295" y="553" font-size="15" fill="#334155">0.2</text><line x1="105" y1="452.00000000000006" x2="1115" y2="452.00000000000006" stroke="#e2e8f0" stroke-width="1.5" /><text x="50" y="457.00000000000006" font-size="15" fill="#334155">10.2</text><line x1="509" y1="160" x2="509" y2="525" stroke="#e2e8f0" stroke-width="1.5" /><text x="497" y="553" font-size="15" fill="#334155">0.5</text><line x1="105" y1="379" x2="1115" y2="379" stroke="#e2e8f0" stroke-width="1.5" /><text x="50" y="384" font-size="15" fill="#334155">11.4</text><line x1="711" y1="160" x2="711" y2="525" stroke="#e2e8f0" stroke-width="1.5" /><text x="699" y="553" font-size="15" fill="#334155">0.7</text><line x1="105" y1="306" x2="1115" y2="306" stroke="#e2e8f0" stroke-width="1.5" /><text x="50" y="311" font-size="15" fill="#334155">12.6</text><line x1="913" y1="160" x2="913" y2="525" stroke="#e2e8f0" stroke-width="1.5" /><text x="901" y="553" font-size="15" fill="#334155">1.0</text><line x1="105" y1="232.99999999999994" x2="1115" y2="232.99999999999994" stroke="#e2e8f0" stroke-width="1.5" /><text x="50" y="237.99999999999994" font-size="15" fill="#334155">13.8</text><line x1="1115" y1="160" x2="1115" y2="525" stroke="#e2e8f0" stroke-width="1.5" /><text x="1103" y="553" font-size="15" fill="#334155">1.2</text><line x1="105" y1="160" x2="1115" y2="160" stroke="#e2e8f0" stroke-width="1.5" /><text x="50" y="165" font-size="15" fill="#334155">15.0</text><text x="1015" y="585" font-size="17" fill="#334155">时间 / s</text><text x="105" y="142" font-size="17" fill="#334155">位置 / m</text><line x1="105" y1="120" x2="140" y2="120" stroke="#2563eb" stroke-width="1.5" /><text x="150" y="126" font-size="17" fill="#334155">模型预测</text><line x1="375" y1="120" x2="410" y2="120" stroke="#d97706" stroke-width="1.5" /><text x="420" y="126" font-size="17" fill="#334155">传感器测量</text><line x1="645" y1="120" x2="680" y2="120" stroke="#059669" stroke-width="1.5" /><text x="690" y="126" font-size="17" fill="#334155">修正后的估计</text><path d="M105.00,464.17 L946.67,342.50" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 5"/><circle cx="946.6666666666667" cy="342.5" r="6" fill="#2563eb"/><text x="746.6666666666667" y="372.5" font-size="18" fill="#2563eb">预测 12 m</text><circle cx="946.6666666666667" cy="281.6666666666667" r="6" fill="#d97706"/><text x="746.6666666666667" y="263.6666666666667" font-size="18" fill="#d97706">测量 13 m</text><circle cx="946.6666666666667" cy="293.8333333333333" r="6" fill="#059669"/><text x="746.6666666666667" y="311.8333333333333" font-size="18" fill="#059669">融合 12.8 m</text><line x1="968.6666666666667" y1="342.5" x2="968.6666666666667" y2="293.8333333333333" stroke="#059669" stroke-width="1.5" /><text x="105" y="625" font-size="21" fill="#334155">预测：10 m + 2 m/s × 1 s = 12 m</text><text x="105" y="664" font-size="18" fill="#334155">修正：12 + 0.8 × (13 − 12) = 12.8 m；竖直修正是更新估计，不是小车瞬间跳动。</text></g></svg>