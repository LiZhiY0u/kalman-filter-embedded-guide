<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="48" font-size="28" fill="#334155">每轮更新：先扩大不确定性，再用测量缩小</text><text x="48" y="82" font-size="17" fill="#64748b">这张图表示估计误差方差，不是温度自身的波动；参数与上一张图独立。</text><line x1="105" y1="160" x2="105" y2="525" stroke="#e2e8f0" stroke-width="1.5" /><text x="93" y="553" font-size="15" fill="#334155">0.0</text><line x1="105" y1="525" x2="1115" y2="525" stroke="#e2e8f0" stroke-width="1.5" /><text x="50" y="530" font-size="15" fill="#334155">0.0</text><line x1="307" y1="160" x2="307" y2="525" stroke="#e2e8f0" stroke-width="1.5" /><text x="295" y="553" font-size="15" fill="#334155">2.4</text><line x1="105" y1="452" x2="1115" y2="452" stroke="#e2e8f0" stroke-width="1.5" /><text x="50" y="457" font-size="15" fill="#334155">0.3</text><line x1="508.99999999999994" y1="160" x2="508.99999999999994" y2="525" stroke="#e2e8f0" stroke-width="1.5" /><text x="496.99999999999994" y="553" font-size="15" fill="#334155">4.8</text><line x1="105" y1="379" x2="1115" y2="379" stroke="#e2e8f0" stroke-width="1.5" /><text x="50" y="384" font-size="15" fill="#334155">0.5</text><line x1="711" y1="160" x2="711" y2="525" stroke="#e2e8f0" stroke-width="1.5" /><text x="699" y="553" font-size="15" fill="#334155">7.2</text><line x1="105" y1="306" x2="1115" y2="306" stroke="#e2e8f0" stroke-width="1.5" /><text x="50" y="311" font-size="15" fill="#334155">0.8</text><line x1="912.9999999999999" y1="160" x2="912.9999999999999" y2="525" stroke="#e2e8f0" stroke-width="1.5" /><text x="900.9999999999999" y="553" font-size="15" fill="#334155">9.6</text><line x1="105" y1="233" x2="1115" y2="233" stroke="#e2e8f0" stroke-width="1.5" /><text x="50" y="238" font-size="15" fill="#334155">1.0</text><line x1="1115" y1="160" x2="1115" y2="525" stroke="#e2e8f0" stroke-width="1.5" /><text x="1103" y="553" font-size="15" fill="#334155">12.0</text><line x1="105" y1="160" x2="1115" y2="160" stroke="#e2e8f0" stroke-width="1.5" /><text x="50" y="165" font-size="15" fill="#334155">1.3</text><text x="1015" y="585" font-size="17" fill="#334155">采样序号 k</text><text x="105" y="142" font-size="17" fill="#334155">误差方差 / ℃²</text><path d="M105.00,244.23 L189.17,188.08 L189.17,466.91 L273.33,410.76 L273.33,481.52 L357.50,425.37 L357.50,483.82 L441.67,427.67 L441.67,484.22 L525.83,428.06 L525.83,484.29 L610.00,428.13 L610.00,484.30 L694.17,428.15 L694.17,484.30 L778.33,428.15 L778.33,484.30 L862.50,428.15 L862.50,484.30 L946.67,428.15 L946.67,484.30 L1030.83,428.15 L1030.83,484.30 L1115.00,428.15 L1115.00,484.30" fill="none" stroke="#2563eb" stroke-width="3" /><circle cx="189.16666666666666" cy="466.9098143236074" r="4" fill="#059669"/><circle cx="273.3333333333333" cy="481.52130022208763" r="4" fill="#059669"/><circle cx="357.5" cy="483.8197005858104" r="4" fill="#059669"/><circle cx="441.66666666666663" cy="484.21773450272934" r="4" fill="#059669"/><circle cx="525.8333333333334" cy="484.28777761291747" r="4" fill="#059669"/><circle cx="610" cy="484.30013782441927" r="4" fill="#059669"/><circle cx="694.1666666666667" cy="484.30232005463927" r="4" fill="#059669"/><circle cx="778.3333333333333" cy="484.3027053670841" r="4" fill="#059669"/><circle cx="862.5" cy="484.3027734020516" r="4" fill="#059669"/><circle cx="946.6666666666667" cy="484.3027854150801" r="4" fill="#059669"/><circle cx="1030.8333333333333" cy="484.3027875362382" r="4" fill="#059669"/><circle cx="1115" cy="484.3027879107742" r="4" fill="#059669"/><line x1="105" y1="120" x2="140" y2="120" stroke="#2563eb" stroke-width="1.5" /><text x="150" y="126" font-size="17" fill="#334155">预测：不确定性增加</text><line x1="375" y1="120" x2="410" y2="120" stroke="#059669" stroke-width="1.5" /><text x="420" y="126" font-size="17" fill="#334155">测量修正后</text><text x="105" y="625" font-size="21" fill="#334155">示例：P⁻ = P + Q，Q = 0.2；P = P⁻R / (P⁻ + R)，R = 0.25。</text><text x="105" y="665" font-size="17" fill="#64748b">连线用于展示更新顺序；竖直下降是同一时刻的测量更新，稳态方差不会无限降到零。</text></g></svg>